name: Prayer Notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-prayer:
    runs-on: ubuntu-latest

    steps:
      - name: Check prayer time
        run: |
          curl -X POST "https://masjid-e-meraj1.vercel.app/api/push/check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"